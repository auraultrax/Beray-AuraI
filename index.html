<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XMAX Asistan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e8e8e8;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid #222;
    font-weight: 600; font-size: 1.05rem;
  }
  #mesajlar {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .mesaj {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  .kullanici { align-self: flex-end; background: #2b6cb0; color: #fff; border-bottom-right-radius: 4px; }
  .asistan { align-self: flex-start; background: #1c1f26; border-bottom-left-radius: 4px; }
  form {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid #222;
  }
  input[type="text"] {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #333; background: #1a1d24; color: #e8e8e8; font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: #2b6cb0; }
  button {
    padding: 0 16px; border-radius: 10px; border: none;
    background: #2b6cb0; color: #fff; font-size: 1rem; cursor: pointer;
  }
  button.mikrofon { background: #1a1d24; border: 1px solid #333; font-size: 1.2rem; }
  button.mikrofon.dinliyor { background: #c53030; border-color: #c53030; }
  button:disabled { opacity: 0.5; cursor: default; }
  #durum { font-size: 0.8rem; color: #888; padding: 0 18px 8px; min-height: 1em; }
</style>
</head>
<body>

<div id="kayitEkrani" style="display:none;position:fixed;inset:0;background:#0f1115;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;">
  <form id="kayitFormu" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;">
    <h2 style="margin-bottom:6px;">XMAX'e Hoş Geldin</h2>
    <p style="font-size:0.85rem;color:#aaa;line-height:1.4;">Adın ve soyadın yalnızca bu cihazda saklanır. Devam ederek bunu kabul edersin.</p>
    <input type="text" id="kayitAd" placeholder="Adın" required style="padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#e8e8e8;">
    <input type="text" id="kayitSoyad" placeholder="Soyadın" required style="padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#e8e8e8;">
    <input type="text" id="kayitAsistanAdi" placeholder="Asistanın adı (XMAX)" value="XMAX" style="padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#e8e8e8;">
    <label style="font-size:0.85rem;color:#aaa;"><input type="checkbox" id="kayitOnay" required> Verilerimin bu cihazda işlenmesini kabul ediyorum</label>
    <button type="submit" style="padding:12px;">Kaydet ve Başla</button>
  </form>
</div>

<header id="baslik">XMAX</header>

<div id="mesajlar">
  <div class="mesaj asistan">Merhaba! Yazarak ya da mikrofona basarak konuşabilirsin.</div>
</div>

<div id="durum"></div>

<form id="formu">
  <button type="button" class="mikrofon" id="mikrofonBtn" title="Sesle konuş">🎤</button>
  <input type="text" id="girdi" placeholder="Bir şey yaz..." autocomplete="off">
  <button type="submit" id="gonderBtn">Gönder</button>
</form>

<script>
  const mesajlar = document.getElementById("mesajlar");
  const formu = document.getElementById("formu");
  const girdi = document.getElementById("girdi");
  const mikrofonBtn = document.getElementById("mikrofonBtn");
  const durum = document.getElementById("durum");
  const sesliCevap = true; // Asistan cevabını sesli okusun mu?

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }

  // ---- Mesaj ekleme ----
  function mesajEkle(metin, tur) {
    const div = document.createElement("div");
    div.className = "mesaj " + tur;
    div.textContent = metin;
    mesajlar.appendChild(div);
    mesajlar.scrollTop = mesajlar.scrollHeight;
  }

  // ---- Model bağlantısı (ŞİMDİLİK YER TUTUCU) ----
  // Buraya ileride yerli/açık model çağrısı gelecek.
  // Şu an sadece girdiyi tekrar eden basit bir cevap döndürüyor.
  async function cevapUret(soru) {
    const kucuk = soru.toLocaleLowerCase("tr-TR").trim();
    const asistanAdi = (localStorage.getItem("xmax_asistan_adi") || "xmax").toLocaleLowerCase("tr-TR");

    // "Merhaba XMAX" tetikleyicisi
    if (kucuk === "merhaba " + asistanAdi || kucuk === asistanAdi) {
      return "Merhaba, öncelikle nasılsınız veya ne konuda konuşmak istersiniz?";
    }

    await new Promise(r => setTimeout(r, 400));
    return "Şimdilik model bağlı değil. Aldığım mesaj: " + soru;
  }

  // ---- Arama için izinli domainler (web araması eklenince kullanılacak) ----
  const IZINLI_UZANTILAR = [".com", ".com.tr", ".k12.tr", ".edu"];
  const IZINLI_ALAN_ADLARI = ["google.com", "google.com.tr"];
  function siteIzinli(url) {
    try {
      const alan = new URL(url).hostname.toLocaleLowerCase("tr-TR");
      const googleMi = IZINLI_ALAN_ADLARI.some(d => alan === d || alan.endsWith("." + d));
      const uzantiUygun = IZINLI_UZANTILAR.some(u => alan.endsWith(u));
      return googleMi && uzantiUygun;
    } catch (e) {
      return false;
    }
  }

  // ---- Kayıt ekranı (bilgiler yalnızca bu cihazda, localStorage'da) ----
  const kayitEkrani = document.getElementById("kayitEkrani");
  const kayitFormu = document.getElementById("kayitFormu");
  const baslik = document.getElementById("baslik");

  function kayitliMi() {
    try { return !!localStorage.getItem("xmax_kayit"); } catch (e) { return false; }
  }

  if (!kayitliMi()) {
    kayitEkrani.style.display = "flex";
  } else {
    const ad = localStorage.getItem("xmax_asistan_adi") || "XMAX";
    baslik.textContent = ad;
  }

  kayitFormu.addEventListener("submit", (e) => {
    e.preventDefault();
    const kayit = {
      ad: document.getElementById("kayitAd").value.trim(),
      soyad: document.getElementById("kayitSoyad").value.trim(),
      asistanAdi: document.getElementById("kayitAsistanAdi").value.trim() || "XMAX"
    };
    try {
      localStorage.setItem("xmax_kayit", JSON.stringify(kayit));
      localStorage.setItem("xmax_asistan_adi", kayit.asistanAdi);
    } catch (err) {}
    baslik.textContent = kayit.asistanAdi;
    kayitEkrani.style.display = "none";
    mesajEkle("Merhaba " + kayit.ad + ", hoş geldin. Merhaba " + kayit.asistanAdi + " diyerek konuşmaya başlayabilirsin.", "asistan");
  });

  // ---- Metin gönderme ----
  formu.addEventListener("submit", async (e) => {
    e.preventDefault();
    const soru = girdi.value.trim();
    if (!soru) return;
    girdi.value = "";
    mesajEkle(soru, "kullanici");
    durum.textContent = "Düşünüyor...";
    const cevap = await cevapUret(soru);
    durum.textContent = "";
    mesajEkle(cevap, "asistan");
    if (sesliCevap) seslendir(cevap);
  });

  // ---- Sesle cevap (tarayıcının Türkçe sesi) ----
  function seslendir(metin) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(metin);
    u.lang = "tr-TR";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // ---- Sesle girdi (tarayıcının konuşma tanıma) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const tanıyıcı = new SR();
    tanıyıcı.lang = "tr-TR";
    tanıyıcı.interimResults = false;

    tanıyıcı.onresult = (e) => {
      girdi.value = e.results[0][0].transcript;
      formu.requestSubmit();
    };
    tanıyıcı.onend = () => {
      mikrofonBtn.classList.remove("dinliyor");
      durum.textContent = "";
    };
    tanıyıcı.onerror = () => {
      mikrofonBtn.classList.remove("dinliyor");
      durum.textContent = "Ses algılanamadı.";
    };

    mikrofonBtn.addEventListener("click", () => {
      mikrofonBtn.classList.add("dinliyor");
      durum.textContent = "Dinliyorum...";
      tanıyıcı.start();
    });
  } else {
    mikrofonBtn.disabled = true;
    mikrofonBtn.title = "Bu tarayıcı ses girişini desteklemiyor";
  }
</script>

</body>
</html>
